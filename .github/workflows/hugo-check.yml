name: Hugo Build and Deploy

on:

  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  hugo-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.151.1'

    - name: Build Hugo site
      run: hugo --minify --cleanDestinationDir

    - name: Check build output
      run: |
        if [ ! -d "public" ]; then
          echo "Build failed: public directory not created"
          exit 1
        fi
        if [ ! -f "public/index.html" ]; then
          echo "Build failed: index.html not found"
          exit 1
        fi
        echo "Build successful: $(find public -name "*.html" | wc -l) HTML files generated"

    - name: Upload build artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: oscw-pr-${{ github.event.pull_request.number }}
        path: public/
        retention-days: 7

  # Tells the server to pull main. The endpoint sits behind Caddy's
  # validate_github, which only checks an HMAC-SHA256 of the body in
  # X-Hub-Signature-256, so we sign a minimal push-like payload ourselves.
  deploy:
    needs: hugo-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: production
      url: https://opensourcecryptowork.shop/
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
    - name: Trigger webhook
      env:
        WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
      run: |
        set -euo pipefail
        : "${WEBHOOK_URL:?DEPLOY_WEBHOOK_URL is not set}" "${WEBHOOK_SECRET:?DEPLOY_WEBHOOK_SECRET is not set}"
        body=$(jq -nc --arg ref "$GITHUB_REF" --arg after "$GITHUB_SHA" '{ref: $ref, after: $after}')
        sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)
        curl --fail-with-body -sS --max-time 60 -X POST \
          -H 'Content-Type: application/json' \
          -H 'X-GitHub-Event: push' \
          -H "X-Hub-Signature-256: sha256=$sig" \
          --data-binary "$body" \
          "$WEBHOOK_URL"
